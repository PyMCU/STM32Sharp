name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore STM32.slnx

      - name: Build
        run: dotnet build STM32.slnx -c Release --no-restore

      - name: Test
        run: dotnet test STM32.slnx -c Release --no-build
